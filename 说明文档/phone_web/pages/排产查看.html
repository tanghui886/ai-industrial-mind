    <style id="theme-vars">
:root {
  /* Brand primary scale — industrial tech cyan */
  --cm-primary-50: #ecfeff;
  --cm-primary-100: #cffafe;
  --cm-primary-200: #a5f3fc;
  --cm-primary-300: #67e8f9;
  --cm-primary-400: #22d3ee;
  --cm-primary-500: #06b6d4;
  --cm-primary-600: #0891b2;
  --cm-primary-700: #0e7490;
  --cm-primary-800: #155e75;
  --cm-primary-900: #164e63;

  /* Neutral slate scale */
  --cm-slate-50: #f8fafc;
  --cm-slate-100: #f1f5f9;
  --cm-slate-200: #e2e8f0;
  --cm-slate-300: #cbd5e1;
  --cm-slate-400: #94a3b8;
  --cm-slate-500: #64748b;
  --cm-slate-600: #475569;
  --cm-slate-700: #334155;
  --cm-slate-800: #1e293b;
  --cm-slate-900: #0f172a;

  /* Semantic tokens */
  --cm-background: var(--cm-slate-50);
  --cm-foreground: var(--cm-slate-900);
  --cm-card: #ffffff;
  --cm-card-foreground: var(--cm-slate-900);
  --cm-popover: #ffffff;
  --cm-popover-foreground: var(--cm-slate-900);
  --cm-primary: var(--cm-primary-600);
  --cm-primary-foreground: #ffffff;
  --cm-muted: var(--cm-slate-100);
  --cm-muted-foreground: var(--cm-slate-500);
  --cm-border: var(--cm-slate-200);
  --cm-input: var(--cm-slate-200);
  --cm-ring: var(--cm-primary-400);

  /* State tokens */
  --cm-state-success: #10b981;
  --cm-state-success-bg: #d1fae5;
  --cm-state-warning: #f59e0b;
  --cm-state-warning-bg: #fef3c7;
  --cm-state-error: #ef4444;
  --cm-state-error-bg: #fee2e2;
  --cm-state-info: var(--cm-primary-500);
  --cm-state-info-bg: var(--cm-primary-50);

  /* Radius */
  --cm-radius-small: 4px;
  --cm-radius-medium: 8px;
  --cm-radius-large: 12px;
  --cm-radius-full: 9999px;

  /* Shadows */
  --cm-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --cm-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --cm-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.22);

  /* Typography */
  --cm-font-sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --cm-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* Spacing scale */
  --cm-s-1: 4px;
  --cm-s-2: 8px;
  --cm-s-3: 12px;
  --cm-s-4: 16px;
  --cm-s-5: 24px;
  --cm-s-6: 32px;
  --cm-s-7: 48px;
  --cm-s-8: 64px;
}

html.dark {
  --cm-background: #0b0f19;
  --cm-foreground: #f1f5f9;
  --cm-card: #111827;
  --cm-card-foreground: #f1f5f9;
  --cm-popover: #111827;
  --cm-popover-foreground: #f1f5f9;
  --cm-muted: #1e293b;
  --cm-muted-foreground: #94a3b8;
  --cm-border: #1e293b;
  --cm-input: #1e293b;
}

body {
  font-family: var(--cm-font-sans);
  background-color: var(--cm-background);
  color: var(--cm-foreground);
}

.cm-heading {
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.cm-kpi-value {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.cm-tabular {
  font-variant-numeric: tabular-nums;
}

    </style>

    <style type="text/tailwindcss">

  }

    <style id="critical-layout">
      html, body { overflow-x: hidden; }
      .cm-mobile-wrap {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background-color: var(--cm-background);
        overflow-x: hidden;
      }
      .cm-app-bar {
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .cm-bottom-nav {
        height: 56px;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .cm-main {
        padding-bottom: calc(56px + env(safe-area-inset-bottom));
      }
      .cm-kpi-card { box-shadow: var(--cm-shadow-2); }
      .cm-day-card { box-shadow: var(--cm-shadow-1); }
      .cm-util-bar { transition: width 0.3s ease; }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

<body class="min-h-screen font-sans antialiased">
    <div class="cm-mobile-wrap">
        <header class="cm-app-bar bg-card border-b border-border px-4 py-3 flex items-center justify-between" data-region="app-bar">
            <div class="flex items-center gap-2 min-w-0">
                <span class="text-primary font-bold text-lg tracking-tight">ContainerMind</span>
                <h1 class="text-base font-semibold text-foreground truncate">排产查看</h1>
            </div>
            <button class="flex items-center gap-1 text-sm text-muted-foreground bg-muted hover:bg-slate-200 transition-colors px-2 py-1.5 rounded-md shrink-0" aria-label="切换工厂">
                <i data-lucide="building-2" class="w-4 h-4"></i>
                <span>启东 QD-D</span>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
            </button>
        </header>

        <main class="cm-main">
            <section class="px-4 pt-3 pb-2 flex items-center justify-between" data-region="month-selector">

                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <h2 class="text-lg font-semibold text-foreground cm-tabular">2026年8月</h2>
                <button class="w-9 h-9 flex items-center justify-center rounded-full bg-card border border-border text-foreground active:bg-muted" aria-label="下个月">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </section>

            <section class="px-4 py-3" data-region="kpi-card">
                <div class="cm-kpi-card bg-card rounded-xl p-4 border border-border">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex flex-col">
                            <span class="text-xs text-muted-foreground">本月计划 TEU</span>
                            <span class="text-lg font-semibold text-foreground cm-tabular">2,400</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-xs text-muted-foreground">已排 TEU</span>

                        </div>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <div class="flex-1">
                            <div class="flex items-baseline gap-1 mb-1">

                                <span class="text-xl font-semibold text-primary">%</span>

                        <div class="flex flex-col items-end gap-1">

                            <span class="text-base font-semibold text-foreground cm-tabular">672 TEU</span>
                        </div>
                    </div>
                    <div class="w-full h-2 bg-muted rounded-full overflow-hidden">

                    </div>
                </div>
            </section>

                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">

                        <span class="text-base font-semibold text-foreground cm-tabular">10</span>
